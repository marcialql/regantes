# Blueprint de Render: app + base de datos PostgreSQL, ambas en Frankfurt (UE).
# Guía paso a paso: deploy/RENDER.md
services:
  - type: web
    name: vales-riego
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeploy: true
    healthCheckPath: /
    # Aplica las migraciones antes de cada versión nueva; si fallan, la versión no se publica.
    preDeployCommand: node scripts/migrate.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vales-riego-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # IP real de quien entra (para frenar intentos de contraseña): Render la pone en esta cabecera.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: AFV_MODE
        value: componentes
      - key: MAILER_MODE
        value: smtp
      # Correo que envía los códigos de acceso (Google Workspace de msgi.es).
      # SMTP_PASS (contraseña de aplicación de Google) se pega en el panel de Render; mientras esté
      # vacía la app funciona, pero los regantes no reciben el código para entrar desde el móvil.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: laherradura@msgi.es
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Vales de riego <laherradura@msgi.es>"

databases:
  - name: vales-riego-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: vales
    user: vales
    # Sin acceso desde Internet: solo la app (red interna de Render) se conecta.
    ipAllowList: []
